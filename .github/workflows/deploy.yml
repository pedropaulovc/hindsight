name: Deploy Hindsight

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: hindsight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Bicep templates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build Bicep templates
        uses: azure/cli@9f7ce6f37c31b777ec6c6b6d1dfe7db79f497956 # v2.2.0
        with:
          inlineScript: |
            set -eu
            az bicep build --file infra/main.bicep --stdout
            az bicep build --file infra/main-rg.bicep --stdout

  deploy:
    name: Deploy Azure resources
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    environment:
      name: prod
      url: https://hindsight.vza.net
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Sign in to Azure with workload identity
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        uses: azure/cli@9f7ce6f37c31b777ec6c6b6d1dfe7db79f497956 # v2.2.0
        env:
          HINDSIGHT_API_KEY: ${{ secrets.HINDSIGHT_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          OTEL_RECEIVER_TOKEN: ${{ secrets.OTEL_RECEIVER_TOKEN }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        with:
          inlineScript: |
            set -eu
            : "${TYPESAFE_API_KEY:?TYPESAFE_API_KEY must be set in the prod environment}"
            # main.bicep provisions the subscription and resource group once.
            # This scoped update keeps the workload identity limited to that group.
            az deployment group create \
              --resource-group rg-hindsight-wu2 \
              --template-file infra/main-rg.bicep \
              --parameters \
                hindsightApiKey="$HINDSIGHT_API_KEY" \
                typesafeApiKey="$TYPESAFE_API_KEY" \
                otelReceiverToken="$OTEL_RECEIVER_TOKEN" \
                postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD"

      - name: Bind custom API hostname
        uses: azure/cli@9f7ce6f37c31b777ec6c6b6d1dfe7db79f497956 # v2.2.0
        with:
          inlineScript: |
            set -eu
            az deployment group create \
              --resource-group rg-hindsight-wu2 \
              --template-file infra/hostname-binding.bicep \
              --parameters \
                appName=app-hindsight-wu2 \
                apiHostname=hindsight.vza.net

      - name: Secure custom API hostname
        uses: azure/cli@9f7ce6f37c31b777ec6c6b6d1dfe7db79f497956 # v2.2.0
        with:
          inlineScript: |
            set -eu
            az deployment group create \
              --resource-group rg-hindsight-wu2 \
              --template-file infra/hostname-tls.bicep \
              --parameters \
                appName=app-hindsight-wu2 \
                planName=plan-hindsight-wu2 \
                apiHostname=hindsight.vza.net
