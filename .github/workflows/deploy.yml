name: Deploy Hindsight

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hindsight-production
  cancel-in-progress: false

jobs:
  build-image:
    name: Publish patched API image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api-image: ${{ steps.publish.outputs.api-image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build and publish patched API image
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r instruction base_image extra < infra/Dockerfile
          if [[ "$instruction" != FROM || -z "$base_image" || -n "$extra" ]]; then
            echo "infra/Dockerfile must contain one FROM image declaration" >&2
            exit 1
          fi
          case "$base_image" in
            ghcr.io/vectorize-io/hindsight-api:* ) ;;
            * ) echo "Unexpected upstream API image: $base_image" >&2; exit 1 ;;
          esac
          upstream_tag="${base_image##*:}"
          image=ghcr.io/pedropaulovc/hindsight-api
          sha_image="$image:sha-$GITHUB_SHA"
          alias_image="$image:$upstream_tag-jev-long-context"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build \
            --file infra/jev-long-context.Dockerfile \
            --build-arg BASE_IMAGE="$base_image" \
            --label org.opencontainers.image.source=https://github.com/pedropaulovc/hindsight \
            --tag "$sha_image" \
            --tag "$alias_image" \
            .
          docker push "$sha_image"
          docker push "$alias_image"
          immutable_image="$(docker image inspect --format '{{index .RepoDigests 0}}' "$sha_image")"
          case "$immutable_image" in
            "$image"@sha256:* ) ;;
            * ) echo "Missing published API image digest" >&2; exit 1 ;;
          esac
          printf 'api-image=%s\n' "$immutable_image" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy Azure resources
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    environment:
      name: prod
      url: https://hindsight.vza.net
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Sign in to Azure with workload identity
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        uses: azure/cli@9f7ce6f37c31b777ec6c6b6d1dfe7db79f497956 # v2.2.0
        env:
          HINDSIGHT_API_KEY: ${{ secrets.HINDSIGHT_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          OTEL_RECEIVER_TOKEN: ${{ secrets.OTEL_RECEIVER_TOKEN }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          API_IMAGE: ${{ needs.build-image.outputs.api-image }}
        with:
          inlineScript: |
            set -eu
            : "${TYPESAFE_API_KEY:?TYPESAFE_API_KEY must be set in the prod environment}"
            # main.bicep provisions the subscription and resource group once.
            # This scoped update keeps the workload identity limited to that group.
            az deployment group create \
              --resource-group rg-hindsight-wu2 \
              --template-file infra/main-rg.bicep \
              --parameters \
                apiImage="$API_IMAGE" \
                hindsightApiKey="$HINDSIGHT_API_KEY" \
                typesafeApiKey="$TYPESAFE_API_KEY" \
                otelReceiverToken="$OTEL_RECEIVER_TOKEN" \
                postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD"

      - name: Bind custom API hostname
        uses: azure/cli@9f7ce6f37c31b777ec6c6b6d1dfe7db79f497956 # v2.2.0
        with:
          inlineScript: |
            set -eu
            az deployment group create \
              --resource-group rg-hindsight-wu2 \
              --template-file infra/hostname-binding.bicep \
              --parameters \
                appName=app-hindsight-wu2 \
                apiHostname=hindsight.vza.net

      - name: Secure custom API hostname
        uses: azure/cli@9f7ce6f37c31b777ec6c6b6d1dfe7db79f497956 # v2.2.0
        with:
          inlineScript: |
            set -eu
            az deployment group create \
              --resource-group rg-hindsight-wu2 \
              --template-file infra/hostname-tls.bicep \
              --parameters \
                appName=app-hindsight-wu2 \
                planName=plan-hindsight-wu2 \
                apiHostname=hindsight.vza.net
