name: Deploy Hindsight

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hindsight-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Azure resources
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://hindsight.vza.net
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Sign in to Azure with workload identity
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        uses: azure/cli@9f7ce6f37c31b777ec6c6b6d1dfe7db79f497956 # v2.2.0
        env:
          HINDSIGHT_API_KEY: ${{ secrets.HINDSIGHT_API_KEY }}
          OTEL_RECEIVER_TOKEN: ${{ secrets.OTEL_RECEIVER_TOKEN }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        with:
          inlineScript: |
            set -eu
            # main.bicep provisions the subscription and resource group once.
            # This scoped update keeps the workload identity limited to that group.
            az deployment group create \
              --resource-group rg-hindsight-wu2 \
              --template-file infra/main-rg.bicep \
              --parameters \
                hindsightApiKey="$HINDSIGHT_API_KEY" \
                otelReceiverToken="$OTEL_RECEIVER_TOKEN" \
                postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD"

      - name: Bind custom API hostname
        uses: azure/cli@9f7ce6f37c31b777ec6c6b6d1dfe7db79f497956 # v2.2.0
        with:
          inlineScript: |
            set -eu
            az deployment group create \
              --resource-group rg-hindsight-wu2 \
              --template-file infra/hostname-binding.bicep \
              --parameters \
                appName=app-hindsight-wu2 \
                apiHostname=hindsight.vza.net
